<!doctype html><meta charset="utf-8"><title>A vida é vermelha</title>
<style>html,body{margin:0;background:#c4001d}svg{display:block}text{font-family:"Times New Roman",Georgia,serif;fill:#fbece4}</style>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1620" viewBox="0 0 1080 1620">
<defs><radialGradient id="bg" cx="50%" cy="50%" r="80%"><stop offset="0" stop-color="#d9001f"/><stop offset="1" stop-color="#8a0014"/></radialGradient></defs>
<rect width="1080" height="1620" fill="url(#bg)"/>
<g id="g"></g>
</svg>
<script>
const NS="http://www.w3.org/2000/svg",g=document.getElementById('g');
function T(s,x,y,fs,len,o={}){const e=document.createElementNS(NS,'text');e.textContent=s;e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('font-size',fs);
 if(len){e.setAttribute('textLength',len);e.setAttribute('lengthAdjust','spacing')}
 for(const k in o)e.setAttribute(k,o[k]);g.appendChild(e)}
T("ainda que a arte seja longa e a vida curta",100,120,26,880,{'font-style':'italic',opacity:.85});
const words=["PÃO","TERRA","TETO","ESCOLA","SAÚDE","DIGNIDADE"];
let y=290;words.forEach(w=>{T(w,100,y,150,880,{'font-weight':'bold'});y+=150});
T("amanhã",100,y,64,880,{'font-style':'italic'});
T("A VIDA",100,y+150,190,880,{'font-weight':'bold',style:'fill:#1a0004'});
T("é vermelha como sangue.",100,y+215,44,880,{'font-style':'italic'});
T("hay que endurecerse, pero sin perder la ternura",100,1500,28,880,{opacity:.9});
T("NESGA",980,1560,26,null,{'text-anchor':'end','font-style':'italic',opacity:.85});
</script>
